project_name: keyforge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: keyforge
    main: ./cmd/keyforge
    binary: keyforge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: keyforge
    name_template: 'keyforge_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CONTRIBUTING.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: danpet-dev
    name: keyforge
  draft: false
  prerelease: auto

brews:
  - name: keyforge
    repository:
      owner: danpet-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    folder: Formula
    homepage: https://github.com/danpet-dev/keyforge
    description: SOPS multi-key lifecycle management CLI
    license: MIT
    # Optional: Runtime dependencies (Homebrew installiert diese automatisch mit)
    dependencies:
      - name: sops
      - name: gnupg
      - name: age

dockers:
  - image_templates:
      - "ghcr.io/danpet-dev/keyforge:{{ .Version }}-amd64"
      - "ghcr.io/danpet-dev/keyforge:latest-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    goos: linux
    goarch: amd64

  - image_templates:
      - "ghcr.io/danpet-dev/keyforge:{{ .Version }}-arm64"
      - "ghcr.io/danpet-dev/keyforge:latest-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    goos: linux
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/danpet-dev/keyforge:{{ .Version }}"
    image_templates:
      - "ghcr.io/danpet-dev/keyforge:{{ .Version }}-amd64"
      - "ghcr.io/danpet-dev/keyforge:{{ .Version }}-arm64"

  - name_template: "ghcr.io/danpet-dev/keyforge:latest"
    image_templates:
      - "ghcr.io/danpet-dev/keyforge:latest-amd64"
      - "ghcr.io/danpet-dev/keyforge:latest-arm64"
